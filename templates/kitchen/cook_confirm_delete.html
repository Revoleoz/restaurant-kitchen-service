{% extends "base.html" %}
{% block title %}Видалити кухаря{% endblock %}
{% block content %}
  <a class="back" href="{% url 'kitchen:cook-list' %}">Кухарі</a>
  <h1>Видалити кухаря?</h1>
  <form method="post" class="panel form-panel">
    {% csrf_token %}
    <p>Буде видалено <strong>«{{ object.username }}»</strong>.</p>
    <div class="actions">
      <button class="button danger" type="submit">Видалити</button>
      <a class="button quiet" href="{% url 'kitchen:cook-list' %}">Скасувати</a>
    </div>
  </form>
{% endblock %}
