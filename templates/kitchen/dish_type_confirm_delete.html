{% extends "base.html" %}
{% block title %}Видалити тип страви{% endblock %}
{% block content %}
  <a class="back" href="{% url 'kitchen:dish-type-list' %}">Типи страв</a>
  <h1>Видалити тип страви?</h1>
  <form method="post" class="panel form-panel">
    {% csrf_token %}
    <p>Буде видалено <strong>«{{ object.name }}»</strong>.</p>
    <p class="danger-link">Страви цього типу також буде видалено.</p>
    <div class="actions">
      <button class="button danger" type="submit">Видалити</button>
      <a class="button quiet" href="{% url 'kitchen:dish-type-list' %}">Скасувати</a>
    </div>
  </form>
{% endblock %}
